<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>WHALE-WORLD</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#04070f;
    font-family:-apple-system,"PingFang SC",system-ui,sans-serif; }
  #bg { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #stage { position:fixed; inset:0; pointer-events:none; }
  #ch { position:absolute; left:50%; bottom:0; transform-origin:50% 100%;
        max-height:78vh; width:auto; will-change: transform; }
  body.roam #ch { max-height:38vh; opacity:1; }
  html.desktop, body.roam { background:transparent; }
  #ch { pointer-events:auto; touch-action:none; }
  #puppet { position:absolute; left:50%; bottom:0; display:none; transform:translateX(-50%);
    pointer-events:auto; touch-action:none; }
  #fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .heart { position:absolute; font-size:22px; animation: floatUp 1.7s ease-out forwards; }
  @keyframes floatUp {
    0%   { opacity:0; transform: translateY(0) scale(.6); }
    20%  { opacity:1; }
    100% { opacity:0; transform: translateY(-120px) scale(1.15); }
  }

  /* 对话气泡 */
  #bubble { position:fixed; left:50%; bottom:34%; transform:translateX(-50%) translateY(10px);
    max-width:min(560px,72vw); padding:14px 20px; border-radius:18px;
    background:rgba(10,20,40,.72); backdrop-filter:blur(14px);
    border:1px solid rgba(120,180,255,.28); color:#dbe9ff; font-size:16px; line-height:1.65;
    opacity:0; transition:opacity .3s ease, transform .3s ease; pointer-events:none;
    box-shadow:0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.03) inset; }
  #bubble.on { opacity:1; transform:translateX(-50%) translateY(0); }
  #bubble .en { display:block; margin-top:6px; font-size:12px; color:#7f9cc9; letter-spacing:.02em; }

  /* 输入条 */
  #chat { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    display:none; gap:10px; align-items:center; width:min(560px,78vw); z-index:5; }
  #chat.on { display:flex; }
  #chat input { flex:1; padding:13px 18px; border-radius:14px; border:1px solid rgba(120,180,255,.25);
    background:rgba(8,16,32,.78); backdrop-filter:blur(14px); color:#e8f2ff; font-size:15px; outline:none; }
  #chat input:focus { border-color:rgba(120,180,255,.55); }
  #chat button { padding:13px 20px; border-radius:14px; border:1px solid rgba(120,180,255,.3);
    background:rgba(30,70,140,.55); color:#cfe3ff; font-size:15px; cursor:pointer; }
  #chat button:hover { background:rgba(40,90,175,.7); }
  #hint { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); font-size:11px;
    color:rgba(150,180,220,.45); letter-spacing:.06em; }
  /* 关系称呼：只在启动/变化时短暂出现，不做常驻数值条 */
  #relation { position:fixed; left:14px; top:12px; padding:5px 11px; border-radius:999px;
    background:rgba(10,25,45,.55); border:1px solid rgba(140,200,255,.25); color:#cfe8ff;
    font-size:11px; letter-spacing:.04em; z-index:6; pointer-events:none; opacity:0;
    transition:opacity .25s ease; backdrop-filter:blur(8px); }
  #relation.on { opacity:1; }
  body.roam #relation { top:auto; bottom:12px; left:12px; }
  body.wallpaper #relation { display:none; }
  #world-controls { position:fixed;top:18px;right:20px;display:none;gap:8px;z-index:6; }
  #world-controls.on { display:flex; }
  #world-controls button { border:1px solid #75c8de55;background:#112e48cc;color:#cceaf4;
    border-radius:20px;padding:8px 14px;font:12px -apple-system,"PingFang SC",sans-serif;cursor:pointer; }
  #portal { position:absolute;display:none;pointer-events:none;border:2px solid #9ce9f8;
    border-radius:50%;box-shadow:0 0 22px #50ccec88,inset 0 0 25px #51add655;
    background:radial-gradient(ellipse,#8fddf833,transparent 65%); }
  #portal::after { content:"";position:absolute;inset:12%;border:1px dashed #c0edffbb;border-radius:50%; }
  #world-scene {position:fixed;inset:0;overflow:hidden;background:#071524;pointer-events:none;}
  #world-scene[hidden]{display:none}
  #world-scene img {width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
  /* 锚点静帧：与待机视频同几何，只在加载/淡出/解码失败时露出 */
  #world-scene #world-anchor { inset:auto; left:var(--figure-x,62.5%); bottom:0;
    height:var(--figure-height,100%); width:auto; transform:translateX(-50%);
    object-fit:contain; opacity:0; transition:opacity .3s ease; z-index:0; pointer-events:none; }
  #world-scene[data-scene="moon"] #world-anchor { inset:0; width:100%; height:100%;
    transform:none; object-fit:cover; }
  #world-scene video {position:absolute;pointer-events:auto;opacity:0;transition:opacity .18s ease;object-fit:contain;max-height:none;}
  #world-scene video[data-layout="figure"] {height:var(--figure-height,100%);width:auto;left:var(--figure-x,62.5%);bottom:0;transform:translateX(-50%);}
  #world-scene video[data-layout="full"] {inset:0;width:100%;height:100%;object-fit:cover;transform:none;}
  #world-bar{position:fixed;left:0;top:0;right:0;height:36px;display:flex;gap:5px;align-items:center;padding:4px 8px;background:linear-gradient(#0b2434df,#0b243420);z-index:7;opacity:0;transition:opacity .15s;-webkit-app-region:drag}
  body:not(.roam):hover #world-bar, #world-bar:focus-within {opacity:1}
  body.roam #world-bar, body.wallpaper #world-bar{display:none}
  #world-bar span{font-size:11px;color:#e2f3ff;margin-right:auto;pointer-events:none}
  #world-bar button {background:#102d44df;color:#dbf5ff;border:1px solid #a8d9ed55;border-radius:8px;padding:4px 7px;font:11px -apple-system,"PingFang SC",sans-serif;cursor:pointer;-webkit-app-region:no-drag}
  #world-bar button.active{background:#327287}
  body:not(.roam) #world-controls{top:auto;bottom:10px;right:10px;opacity:0;transition:opacity .15s}
  body:not(.roam):hover #world-controls,#world-controls:focus-within{opacity:1}
  body.wallpaper #world-controls{display:none}
  #video-status{position:fixed;bottom:8px;left:10px;color:#e5f3ff;background:#0a2639b3;border-radius:7px;padding:5px 8px;font-size:11px;z-index:6;pointer-events:none;max-width:65%;display:none}
  #video-status.on{display:block}
  #placement{display:none;position:fixed;top:40px;left:10px;z-index:8;background:#0c2946ee;color:#d4edff;padding:10px;border-radius:10px;font-size:11px}
  #placement.on{display:grid;gap:8px}#placement label{display:flex;align-items:center;gap:8px}#placement input{-webkit-app-region:no-drag;width:115px}
  @media(prefers-reduced-motion:reduce){#world-scene video{transition:none}}
</style>
</head>

<script>
/* ───────── 海底场景（程序化，纯 f(t)） ───────── */
const cv = document.getElementById("bg");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // The background canvas is display:none on desktop. Its client size becomes
  // zero on resize, so dimensions must come from the actual viewport.
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

// 确定性伪随机
function hash(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }

const MOTES = [], GLOWS = [], RAYS = [];
function seedScene() {
  MOTES.length = 0; GLOWS.length = 0; RAYS.length = 0;
  for (let i = 0; i < 190; i++) {
    MOTES.push({
      x: hash(i + 1), y: hash(i + 91),
      r: 0.6 + hash(i + 181) * 1.9,
      sp: 0.006 + hash(i + 271) * 0.022,      // 循环内漂移速度
      ph: hash(i + 361) * Math.PI * 2,
      sw: 0.004 + hash(i + 451) * 0.012,
      a: 0.32 + hash(i + 541) * 0.55,
    });
  }
  for (let i = 0; i < 26; i++) {
    GLOWS.push({
      x: hash(i + 700), y: hash(i + 800),
      r: 26 + hash(i + 900) * 90,
      ph: hash(i + 1000) * Math.PI * 2,
      a: 0.05 + hash(i + 1100) * 0.12,
      hue: 190 + hash(i + 1200) * 60,
    });
  }
  for (let i = 0; i < 7; i++) {
    RAYS.push({
      x: 0.06 + i * 0.145 + hash(i + 1300) * 0.05,
      w: 0.045 + hash(i + 1400) * 0.075,
      ph: hash(i + 1500) * Math.PI * 2,
      a: 0.13 + hash(i + 1600) * 0.16,
      tilt: (hash(i + 1700) - 0.5) * 0.16,
    });
  }
}

function drawBackground(t) {
  // t: 秒
  const P = 2 * Math.PI;
  // 底色渐变
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#16406e");
  g.addColorStop(0.22, "#0e2a52");
  g.addColorStop(0.55, "#0a1734");
  g.addColorStop(0.82, "#070d20");
  g.addColorStop(1, "#04060f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 上方微光（水面方向）
  const top = ctx.createRadialGradient(W * 0.5, -H * 0.25, 0, W * 0.5, -H * 0.25, H * 1.05);
  top.addColorStop(0, "rgba(160,215,255,0.42)");
  top.addColorStop(0.35, "rgba(90,150,240,0.16)");
  top.addColorStop(0.7, "rgba(50,90,180,0.05)");
  top.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, H);

  // 光柱（柔化）
  ctx.globalCompositeOperation = "lighter";
  ctx.filter = "blur(22px)";
  for (const r of RAYS) {
    const sway = Math.sin(t * 0.35 + r.ph) * 0.035;
    const x0 = (r.x + sway) * W;
    const wTop = r.w * W * 0.45, wBot = r.w * W * 1.9;
    const tilt = r.tilt * W * 0.35;
    const alpha = r.a * (0.72 + 0.28 * Math.sin(t * 0.5 + r.ph * 1.7));
    const lg = ctx.createLinearGradient(x0, 0, x0 + tilt, H);
    lg.addColorStop(0, `rgba(190,230,255,${alpha})`);
    lg.addColorStop(0.45, `rgba(130,190,250,${alpha * 0.45})`);
    lg.addColorStop(1, "rgba(80,120,200,0)");
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.moveTo(x0 - wTop / 2, -10);
    ctx.lineTo(x0 + wTop / 2, -10);
    ctx.lineTo(x0 + tilt + wBot / 2, H + 10);
    ctx.lineTo(x0 + tilt - wBot / 2, H + 10);
    ctx.closePath(); ctx.fill();
  }

  ctx.filter = "none";

  // 远景鲸影
  ctx.globalCompositeOperation = "source-over";
  const whaleX = W * 0.80 + Math.sin(t * 0.12) * 26;
  const whaleY = H * 0.26 + Math.cos(t * 0.09) * 10;
  const ws0 = Math.min(W, H) * 0.095;
  ctx.save();
  ctx.translate(whaleX, whaleY);
  ctx.globalAlpha = 0.055 + 0.02 * Math.sin(t * 0.3);
  ctx.filter = "blur(6px)";
  ctx.fillStyle = "#a8dcff";
  ctx.beginPath();
  ctx.ellipse(0, 0, ws0, ws0 * 0.34, -0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();                       // 尾鳍
  ctx.moveTo(-ws0 * 0.92, 0);
  ctx.quadraticCurveTo(-ws0 * 1.35, -ws0 * 0.30, -ws0 * 1.55, -ws0 * 0.02);
  ctx.quadraticCurveTo(-ws0 * 1.32, ws0 * 0.10, -ws0 * 0.92, ws0 * 0.06);
  ctx.fill();
  ctx.beginPath();                       // 胸鳍
  ctx.moveTo(-ws0 * 0.1, ws0 * 0.24);
  ctx.quadraticCurveTo(ws0 * 0.18, ws0 * 0.62, ws0 * 0.42, ws0 * 0.34);
  ctx.quadraticCurveTo(ws0 * 0.2, ws0 * 0.22, -ws0 * 0.1, ws0 * 0.24);
  ctx.fill();
  ctx.restore();
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "lighter";

  // 水面焦散
  for (let i = 0; i < 26; i++) {
    const cx = (i / 26) * W + Math.sin(t * 0.7 + i) * 26;
    const cy = 40 + Math.sin(t * 0.9 + i * 1.7) * 22;
    const rw = 60 + Math.sin(t * 1.3 + i) * 34;
    const rh = 9 + Math.cos(t * 1.1 + i) * 5;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rw);
    cg.addColorStop(0, "rgba(200,240,255,0.10)");
    cg.addColorStop(1, "rgba(160,220,255,0)");
    ctx.fillStyle = cg;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(1, rh / rw);
    ctx.beginPath(); ctx.arc(0, 0, rw, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  // 浮游生物光晕
  for (const b of GLOWS) {
    const pulse = 0.55 + 0.45 * Math.sin(t * 0.55 + b.ph);
    const x = b.x * W + Math.sin(t * 0.22 + b.ph) * 18;
    const y = b.y * H + Math.cos(t * 0.18 + b.ph * 1.3) * 14;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, `hsla(${b.hue},90%,72%,${b.a * pulse})`);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, b.r, 0, P); ctx.fill();
  }

  // 悬浮微粒（向上漂，wrap 保证循环）
  for (const m of MOTES) {
    const y = ((m.y - m.sp * t) % 1 + 1) % 1;
    const x = ((m.x + Math.sin(t * 0.4 + m.ph) * m.sw) % 1 + 1) % 1;
    const tw = 0.6 + 0.4 * Math.sin(t * 1.1 + m.ph);
    ctx.fillStyle = `rgba(190,225,255,${m.a * tw})`;
    ctx.beginPath(); ctx.arc(x * W, y * H, m.r, 0, P); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  // 海床微光
  const bed = ctx.createLinearGradient(0, H * 0.72, 0, H);
  bed.addColorStop(0, "rgba(20,60,110,0)");
  bed.addColorStop(1, "rgba(28,80,140,0.20)");
  ctx.fillStyle = bed; ctx.fillRect(0, H * 0.72, W, H * 0.28);

  // 暗角
  const vg = ctx.createRadialGradient(W * 0.5, H * 0.46, H * 0.18, W * 0.5, H * 0.5, H * 0.92);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,0.62)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ───────── 角色 ───────── */
const ch = document.getElementById("ch");
const fx = document.getElementById("fx");
const bubble = document.getElementById("bubble");
const relationEl = document.getElementById("relation");
let relationTimer = 0;
function showRelation(state) {
  if (!state) return;
  const text = state.call ? `她叫你：${state.call}` : "";
  relationEl.textContent = text;
  relationEl.classList.toggle("on", !!text);
  clearTimeout(relationTimer);
  relationTimer = setTimeout(() => relationEl.classList.remove("on"), 6000);
}
let imgReady = false, mode = "world", roaming = false;
let speaking = false, emotion = "calm", emoT = 0;
const puppet = document.getElementById("puppet");
const dshRoot=document.createElement('div');dshRoot.id='dsh-pet';dshRoot.style.cssText='position:absolute;display:none;transform:translateX(-50%);pointer-events:auto;touch-action:none;';document.getElementById('stage').append(dshRoot);
let dshEnabled=true;
try{dshEnabled=localStorage.getItem('lan.desktop.pack')!=='original';}catch(_){}
const dshPlayer=new DshMotion.Player({container:dshRoot,onReady:()=>syncCharacterVisibility(),onError:()=>syncCharacterVisibility()});
dshPlayer.enabled=dshEnabled;
const idleGestures=new DshActions.IdleGestures();
try{idleGestures.enabled=localStorage.getItem('lan.desktop.idleGestures')!=='off';}catch(_){idleGestures.enabled=true;}
function dshActive(){return mode==='desktop'&&dshEnabled&&dshPlayer.enabled&&dshPlayer.ready;}
const idleDance=new DshIdleDance.Controller({media:DshIdleMedia,onError:message=>{actionStatus.textContent=message;}});
try{idleDance.enabled=localStorage.getItem('lan.desktop.idleDance')!=='off';idleDance.setSound(localStorage.getItem('lan.desktop.idleDanceSound')!=='off');idleDance.setVolume(localStorage.getItem('lan.desktop.idleDanceVolume')??.35);idleDance.setTrack(DshIdleMedia.defaultTrack,performance.now());}catch(_){}
function stopIdleDance(){if(idleDance.stop(performance.now())&&((dshPlayer.pending||dshPlayer.key)==='shunguai'))dshPlayer.release();}
const motion = new ChibiMotion.Controller(Math.floor(Math.random()*4294967296));
const performer = new ChibiPerformance.Director();
const face = new ChibiFace.Controller();
const presence = new ChibiPresence.Controller();
let travelPending=null,travelHandoff=false,modeInitialized=false;
const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
let rigRenderer = null, rigError = null, pointer = null, drag = null, rigDebug = null;
let suppressClickUntil = 0, chatPending = false;
let presentationScale=1,desktopSize=180,atlasError=null,pokeCount=0,lastPoke=0;
let nextEdgePlay=performance.now()+45000;
let lastDecoration=0;
// Dance humming: renderer-level Audio fed by the generated ChibiDance payload.
// Simple mutex with speaking; unified audio arbitration stays with DW-05.
const danceHum=new ChibiHum.HumController();
let danceAudio=null;
function humTick(scene){
  const action=danceHum.update(scene,{audioReady:!dshActive()&&mode==="desktop"&&!!(globalThis.ChibiDance?.audio),speaking,reducedMotion:motionPreference.matches});
  if(!action)return;
  if(action==="play"){
    if(!danceAudio){danceAudio=new Audio(ChibiDance.audio.url);danceAudio.loop=true;danceAudio.volume=.55;}
    danceAudio.play().catch(()=>{danceHum.reset();});
  }else if(danceAudio){danceAudio.pause();try{danceAudio.currentTime=0;}catch(e){}}
}
// 碎碎念（dsh-pet whisper 思路的轻量版）：空闲时她周期性主动说一句。
// 复用 touch 台词池与气泡；预生成语音与独立台词池属于 VOICE-01。
// ?whisper=<秒> 可缩短周期用于预览/验收；默认 240s，±20% 抖动更自然。
(function initWhisper(){
  const params=new URLSearchParams(location.search);
  const base=(Number(params.get("whisper"))||240)*1000;
  if(!(base>=3000))return;
  function whisper(){
    const busy=speaking||chatPending||drag||document.hidden||presence.action
      ||performer.activity!=="idle"||performer.event
      ||(mode==="desktop"&&pet&&pet.state!=="idle");
    if(!busy){
      window.malfoyHost?.touchLine?.("touch")
        .then(line=>{if(line){showBubble(line,"",5000);if(mode==="desktop")performer.notify("greet");}})
        .catch(()=>{});
    }
    setTimeout(whisper,base*(0.8+Math.random()*0.4));
  }
  setTimeout(whisper,base*(0.8+Math.random()*0.4));
})();
function setActivity(name){
  if(!performer.setActivity(name))return false;
  if(name!=="idle")stopIdleDance();

/* ───────── 窗口边缘互动（爬窗） ───────── */
let wins = [], perch = null, seated = false;
let pet = { state: "idle", x: 0, y: 0, dir: 1, t: 0, idle: 2, walkFor: 7, placed: false };
function restFor(seconds) { pet.state="idle"; pet.idle=seconds; pet.t=0; }
function walkFor() { pet.state="walk"; pet.walkFor=4+Math.random()*6; pet.t=0; }
let jump = null;          // {x0,y0,x1,y1,t,dur}
let lastWinPoll = 0;

async function pollWindows() {
  if (!window.malfoyHost || !window.malfoyHost.windows) return;
  try {
    const list = await window.malfoyHost.windows();
    if (Array.isArray(list)) wins = list.filter(w =>
      [w.x,w.y,w.w,w.h].every(Number.isFinite) && w.w>240 && w.h>160 &&
      w.x<W && w.x+w.w>0 && w.y<H && w.y+w.h>0).map(w=>({...w}));
  } catch (e) {}
}

function windowTopY(w) { return w.y; }          // 顶边（CG 坐标 y 向下）

// Only real top edges with enough headroom are used. Never substitute the bottom.
function perchGeometry(){return {width:W,height:H,charHeight:characterHeight(),seated};}
function perchLine(w) { return w.y; }
function pickWindow(exclude) { return WindowPerch.choose(wins.filter(w=>w!==exclude),perchGeometry(),pet.x); }
async function sitOnWindow(){
  stopIdleDance();
  if(mode!=='desktop')return false;
  await pollWindows();
  const target=WindowPerch.choose(wins,{...perchGeometry(),seated:true},pet.x);
  if(!target){showBubble('把一个窗口往下挪一点，给我留出坐的位置。');return false;}
  if(!dshEnabled){dshEnabled=true;dshPlayer.enabled=true;syncPack();syncCharacterVisibility();}
  seated=true;moveTarget=null;dshPlayer.release();startJump(target);return true;
}
function leaveSeat(){seated=false;dshPlayer.release();if(perch){perch=null;jump=null;pet.state='fall';}}

function startJump(tw) {
  if (!tw) { // 没目标就掉下去
    perch=null;seated=false;pet.state = "fall";
    return;
  }
  const margin=characterHeight()*characterAspect()*.5+8;
  const tx = Math.max(margin,Math.min(W-margin,tw.x+tw.w*.5));
  const ty = perchLine(tw);
  jump = { x0: pet.x, y0: pet.y, x1: tx, y1: ty, t: 0, dur: 0.75 };
  pet.state = "jump";
  perch = tw;
}

/* ───────── 听指令走动（模型在回复里写 [move:x]，主进程转发过来） ───────── */
let moveTarget = null;

// 她在这个落点上会被窗口盖掉多少（像素面积）。
function coverAt(x, cw, ch) {
  const feet = H - 2;
  let cover = 0;
  for (const w of wins) {
    const ox = Math.min(x + cw / 2, w.x + w.w) - Math.max(x - cw / 2, w.x);
    const oy = Math.min(feet, w.y + w.h) - Math.max(feet - ch, w.y);
    if (ox > 0 && oy > 0) cover += ox * oy;
  }
  return cover;
}

// 挑落点：**先躲遮挡，再贴方向**。
//
// 只在前三分之一里找是不够的 —— 如果浏览器把左半屏铺满了，那个区间里每个点
// 都被挡住，她还是会一头钻进去。所以候选点铺满整屏，评分 = 遮挡占比 + 偏离方向的惩罚：
// 遮挡权重 1.0、每偏离一屏宽 0.35，于是「完全被挡」永远输给「没被挡但偏一点」，
// 结果是「能走多左就走多左，但不走进窗口底下」。
function pickSpot(from, to, cw, ch) {
  const area = Math.max(1, cw * ch);
  let best = null;
  for (let i = 0; i <= 48; i += 1) {
    const x = (W * i) / 48;
    const outside = x < from ? from - x : x > to ? x - to : 0;
    const score = coverAt(x, cw, ch) / area + (outside / Math.max(1, W)) * 0.35;
    if (!best || score < best.score) best = { x, score };
  }
  return best ? best.x : (from + to) / 2;
}

function moveTo(target) {
  if (mode !== "desktop") return false;
  seated=false;dshPlayer.release();
  const ch = characterHeight(), cw = ch * characterAspect();
  const margin = cw * .5 + 8;
  const side = target && target.side;
  let x = Number.isFinite(target && target.x) ? target.x : null;
  if (x === null && side === "floor") x = pet.x;   // 下到地面但留在原地，别顺带横移
  if (x === null) {
    const r = side === "left" ? [margin, W * 0.34]
            : side === "right" ? [W * 0.66, W - margin]
            : side === "center" ? [W * 0.40, W * 0.60]
            : [margin, W - margin];
    x = pickSpot(r[0], r[1], cw, ch);
  }
  x = Math.max(margin, Math.min(W - margin, x));
  // 一律走地面：站在窗口顶边时只能走到那个窗口的宽度为止，
  // 而「去左边」这种要求只有地面能办到，所以先下来。
  if (perch) { perch = null; seated=false; jump=null; pet.state = "fall"; }
  moveTarget = { x };
  pet.dir = x > pet.x ? 1 : -1;
  if (pet.state === "idle" || pet.state === "walk") pet.state = "walk";
  return true;
}

// 上报「我在哪」。位置没变也要发：窗口列表会变，遮挡关系跟着变。
let lastReport = 0;
function reportPresence() {
  const host = window.malfoyHost;
  if (!host || !host.presence || mode !== "desktop") return;
  const now = performance.now();
  if (now - lastReport < 1200) return;
  lastReport = now;
  const ch = characterHeight(), cw = ch * characterAspect();
  try {
    host.presence({
      x: Math.round(pet.x), y: Math.round(pet.y),
      w: Math.round(cw), h: Math.round(ch),
      // 用 W/H 而不是 screen.width：pet.x 是**窗口内**坐标，
      // 舞台窗口铺满主屏时两者相等，不相等时也必须是 W/H 才算得对。
      sw: Math.round(W), sh: Math.round(H),
      state: pet.state,
      perch: perch ? perch.app : null,
      wins: wins.map(w => ({ app: w.app, x: w.x, y: w.y, w: w.w, h: w.h })),
    });
  } catch (_) {}
}

function updatePet(dt, now) {
  if (mode !== "desktop" || drag && drag.moved || presence.action) return;
  // 关掉闲逛时她该站着不动，但**被明确叫去某处**是例外 —— 那不是闲逛。


  // 每 2.5s 拉一次窗口（now 单位 ms）
  if (now - lastWinPoll > 500) { lastWinPoll = now; pollWindows(); }

  // 首次落位
  if (!pet.placed) {
    if (pickWindow(null)) {
      perch = pickWindow(null);
      pet.x = perch.x + perch.w * 0.5;
      pet.y = perchLine(perch);
      pet.state = "idle"; pet.idle = 0.6;
    } else {
      pet.x = W * 0.5; pet.y = H - 2; restFor(2+Math.random()*3);
    }
    pet.placed = true;
    return;
  }

  // Follow a moving/resizing window even when roaming is off or she is busy.
  if (perch) {
    const still=WindowPerch.match(perch,wins);
    if(still&&WindowPerch.eligible(still,perchGeometry())){
      const next=WindowPerch.follow(perch,still,jump?jump.x1:pet.x,{...perchGeometry(),aspect:characterAspect()});
      if(jump){jump.x1=next.x;jump.y1=next.y;}else{pet.x=next.x;pet.y=next.y;}
      perch=still;
    }else{perch=null;seated=false;jump=null;pet.state='fall';dshPlayer.release();}
  }
  if(pet.state!=='fall'&&pet.state!=='jump'&&!moveTarget){
    if(seated&&perch){restFor(2);return;}
    if(!roaming||motionPreference.matches||(dshActive()&&(dshPlayer.sleeping||dshPlayer.manual)))return;
  }

  // A gesture/activity/hover owns the body until it can safely return to walking.
  // Do not freeze a jump/fall in midair.
  const held=performer.activity!=="idle" || performer.event || performer.ambient || motion.action || document.activeElement===input ||
    (pointer && characterHit(pointer.x,pointer.y));
  // 被明确叫去某处时，「正在做伸展动作 / 鼠标停在她身上」都不该把她钉在原地 ——
  // 实测 motion.action 会把一次 moveTo 完全吃掉，她一动不动而 moveTarget 一直挂着。
  if (held && !moveTarget && (pet.state==="idle" || pet.state==="walk")) {
    restFor(Math.max(pet.idle,1));
    if (perch) pet.y=perchLine(perch);
    return;
  }

  // 有窗口但没栖息 → 跳过去。有人点了名要她去哪时先别乱跳，否则刚起步就被弹回窗口上。
  if (!moveTarget && !perch && wins.length && pet.state !== "jump" && pet.state !== "fall") {
    startJump(pickWindow(null));
    return;
  }

  const SPEED = 62;   // px/s
  if (pet.state === "walk") {
    const margin=characterHeight()*characterAspect()*.5+8;
    // 有明确落点时边界就是屏幕两端：窗口范围限制只在「在窗口顶边闲逛」时才有意义。
    const left = moveTarget ? margin : Math.max(margin,Math.min(W-margin,perch ? perch.x+margin : margin));
    const right = moveTarget ? W-margin : Math.max(left,Math.min(W-margin,perch ? perch.x+perch.w-margin : W-margin));
    if (moveTarget) {
      const dx = moveTarget.x - pet.x;
      if (Math.abs(dx) <= 6) { pet.x = moveTarget.x; moveTarget = null; restFor(2.5); }
      else pet.dir = dx > 0 ? 1 : -1;
    }
    pet.x += SPEED * pet.dir * dt;
    if (pet.x <= left)  { pet.x = left;  pet.dir = 1;  if (perch && Math.random() < 0.45) startJump(pickWindow(perch)); }
    if (pet.x >= right) { pet.x = right; pet.dir = -1; if (perch && Math.random() < 0.45) startJump(pickWindow(perch)); }
    pet.y = perch ? perchLine(perch) : H - 2;
    // 赶路时不累计闲逛计时，否则走到一半会因为 walkFor 到期而停下。
    if (moveTarget) pet.t = 0;
    else { pet.t += dt; if (pet.t >= pet.walkFor) restFor(4+Math.random()*7); }
  } else if (pet.state === "idle") {
    pet.idle -= dt;
    if (perch) pet.y = perchLine(perch);
    // 落点还在等着：从窗口掉下来、或刚好走神停下时，立刻接着赶路。
    if (moveTarget) { pet.state = "walk"; pet.t = 0; }
    else if (pet.idle <= 0) walkFor();
  } else if (pet.state === "jump" && jump) {
    jump.t += dt;
    const k = Math.min(1, jump.t / jump.dur);
    pet.x = jump.x0 + (jump.x1 - jump.x0) * k;
    const baseY = jump.y0 + (jump.y1 - jump.y0) * k;
    pet.y = baseY - Math.sin(Math.PI * k) * 90;
    if (k >= 1) { pet.y = jump.y1; jump = null; pet.state = "idle"; pet.idle = 0.5; }
  } else if (pet.state === "fall") {
    pet.y += 520 * dt;
    if (pet.y >= H - 2) { pet.y = H - 2; pet.state = "idle"; pet.idle = 0.8; }
  }
}

/* 主循环 */

let t0 = performance.now();
function loop(now) {
  const t = (now - t0) / 1000;

  if (mode === "world" && !worldVideo.current) drawBackground(t);

  const dt=loop._last == null ? 0 : Math.min(.1,(now-loop._last)/1000);

function attachPetInput(element) {
  element.addEventListener("pointerdown",e=>{
    if(mode!=="desktop" || e.button!==0 || !characterHit(e.clientX,e.clientY)) return;

const chatBox = document.getElementById("chat");

let history = [];

async function sendChat() {
  const text = input.value.trim();
  if (!text || chatPending) return;
  chatPending=true;setActivity("thinking");
  input.value = "";
  showBubble(text, "", 3000);
  try {
    const r = await window.malfoyHost.chat(text, history);
    history.push({ role: "user", content: text }, { role: "assistant", content: r.text });
    if (history.length > 12) history = history.slice(-12);
    setEmotion(r.emo);
    showBubble(r.text, "", 8000);
    if (r.voice && !r.deliveredToStage) speak(r.voice);
    else {setActivity("idle");if(!performer.event)performer.notify("greet");}
  } catch (e) {
    showBubble("……信号断了。", "", 4000);
    setActivity("idle");performer.notify("chat-failed");
  } finally {chatPending=false;}
}

    const b=document.createElement('button');b.dataset.action=key;b.textContent=item.label;b.title=item.generated?'新绘序列帧':'原版连续动画';b.style.cssText='position:relative;min-height:40px;padding:8px 4px;border:1px solid #c6d8cf;background:#e8f0e8;color:#32575f;font-size:11px;line-height:1.5';
    if(item.generated){const mark=document.createElement('span');mark.textContent='新绘';mark.style.cssText='display:block;font-size:9px;color:#568777';b.append(mark);}
    b.onclick=()=>previewAction(key);actionGrid.append(b);
  }
  for(const b of tabs.children){const active=b.dataset.category===actionCategory;b.setAttribute('aria-pressed',String(active));b.style.background=active?'#c5dfd2':'#edf4ee';}
  results.textContent=entries.length?'显示 '+entries.length+' / '+Object.keys(DshMotion.catalog).length+' 项':'没有找到，试试“吃”“表情”或“新绘”。';
}
actionSearch.oninput=renderActions;renderActions();packMenu.append(tabs,results,actionGrid);
const credit=document.createElement('a');credit.href='https://github.com/PC2005-cloud/dsh-pet';credit.target='_blank';credit.rel='noopener';credit.textContent='dsh-pet / PC2005-cloud · 大肥鱼';credit.style.cssText='display:block;color:#507974;font-size:10px;margin:6px 0;';
const license=document.createElement('small');license.textContent='上善无形 / ZipZipPipe · CC BY-NC-SA 4.0，非商业动作素材。';license.style.cssText='display:block;color:#84958a;font-size:9px;line-height:1.7';packMenu.append(credit,license);
packMenu.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();packMenu.hidden=true;packButton.setAttribute('aria-expanded','false');updateHit();}});
packButton.onclick=()=>{packMenu.hidden=!packMenu.hidden;packButton.setAttribute('aria-expanded',String(!packMenu.hidden));updateHit();};
packNav.prepend(packButton);packNav.append(packMenu);
document.addEventListener('pointerdown',e=>{if(!packNav.contains(e.target)){packMenu.hidden=true;packButton.setAttribute('aria-expanded','false');}});

/* 初始化 */
function init() {
  resize(); seedScene();
  const q = new URLSearchParams(location.search);
  setMode(q.get("mode") === "desktop" ? "desktop" : "world");
  // The native app uses composer.html. Keep embedded input only for an
  // explicitly requested standalone preview, never on the desktop surface.
  if (q.get("chat") === "1" && chatBox && !window.malfoyHost) chatBox.classList.add("on");
  document.body.classList.toggle("wallpaper", q.get("wallpaper") === "1");
  document.getElementById("world-controls").classList.toggle("on",q.get("chat")==="1"||!!window.malfoyHost);
  if (q.get("chat") === "1") document.getElementById("hint").style.display = "block";
  else document.getElementById("hint").style.display = "none";

  if (window.malfoyHost) {
    window.malfoyHost.affection?.().then(showRelation).catch(() => {});
    window.malfoyHost.onAffection?.(showRelation);
    if (window.malfoyHost.onCharacterMode) {
      window.malfoyHost.onCharacterMode((p) => setMode(p && p.mode === "desktop" ? "desktop" : "world"));
    }
    window.malfoyHost.onSceneVideo?.(videoMode);
    window.malfoyHost.onDesktopSize?.(setDesktopSize);
    // 主进程让她挪位置（模型在回复里写了 [move:left] 之类）。
    window.malfoyHost.onCharacterMove?.((p) => { moveTo(p || {}); });
    window.malfoyHost.onSceneVisible?.(visible => {
      worldVideo.hide(!visible); loop._last = null;if(!visible)stopIdleDance();
      if (visible) { travelHandoff=false; presence.travel("in", mode); }
    });
    window.malfoyHost.onStopVoice?.(() => {stopIdleDance();humTick({scene:"idle"});mediaPlayback.stop();});
    window.malfoyHost.onSceneMedia?.(p=>{stopIdleDance();mediaPlayback.command(p);});
    window.malfoyHost.onCharacterActivity?.(activity => {
      chatPending = activity !== "idle";
      worldVideo.busy(chatPending || speaking);
      if (!speaking) setActivity(activity);
    });
    if (window.malfoyHost.onCharacterSay) {
      window.malfoyHost.onCharacterSay((p) => {
        if (!p) return;
        if (p.text) showBubble(p.text, p.en || "", 8000);
        if (p.emo) setEmotion(p.emo);
        if (p.voice || p.audio) {
          // chunk = 流式回复的其中一句，接队尾；否则是整段，直接换台
          if (p.chunk) speakChunk(p.voice || p.audio, p.mime);
          else speak(p.voice || p.audio);
        } else if (!p.partial) worldVideo.interact();
      });
    }
  }
  requestAnimationFrame(loop);
}

window.addEventListener("resize", () => { resize();pet.x=Math.min(W,pet.x);pet.y=Math.min(H-2,pet.y); });
document.addEventListener("visibilitychange",()=>{
  loop._last=null;worldVideo.hide(document.hidden);if(document.hidden){stopIdleDance();humTick({scene:"idle"});}
  // Restore the last desktop position immediately, before the next animation
  // frame, so the first pointer event after activation still hits the pet.
  if(mode==="desktop")dshPlayer.place(pet.x,pet.y,characterHeight(),!document.hidden&&dshActive());
});
init();

window.Character = {
  setMode, setRoam, setEmotion, getEmotion, speak, showBubble, spawnHearts,
  showVideo, hideVideo,
  videoMode,
  get video() { return { ...worldVideo.snapshot, name: worldVideo.snapshot.state, failed: !!worldVideo.error, active: videoActive() }; },
  get speaking() { return speaking; },
  get playback(){return mediaPlayback.snapshot;},
  get roaming() { return roaming; },
  get mode() { return mode; },
  get lastHit() { return lastHit; },
  action: (name,options) => {const accepted=motion.requestAction(name,options);if(accepted)performer.emote(({greet:"waving",nod:"happy",look:"thinking",stretch:"waving",sway:"shy"})[name]);return accepted;},
  setActivity,
  react: name => {
    if((name==="task-complete"||name==="task-failed")&&performer.activity==="working")setActivity("idle");
    return performer.notify(name);
  },
  emote: scene => performer.emote(scene),
  setExpression: (name,options)=>face.setExpression(name,options),
  setFace: parameters=>face.setParameters(parameters),
  clearFace: ()=>face.clear(),
  blink: ()=>face.blink(),
  get face(){return {...face.state,ready:!!rigRenderer?.atlas?.independentFaces};},
  peek,travel:travelTo,
  get presence(){return {...presence.state};},
  clearReaction: () => {performer.event=null;performer.ambient=null;},
  setPresentationScale: value => {if(!Number.isFinite(value)||value<.6||value>1.6)return false;presentationScale=value;return true;},
  setDesktopSize,
  get desktopSize(){return {preferred:desktopSize,height:characterHeight(),aspect:characterAspect()};},
  get performance() {return {...performer.state,atlasReady:!!rigRenderer?.atlas,error:atlasError};},
  setRigDebug: on => {
    if(on && !rigDebug){rigDebug=document.createElement("canvas");document.getElementById("stage").appendChild(rigDebug);}
    else if(!on && rigDebug){rigDebug.remove();rigDebug=null;}
  },
  hitTest: (x,y) => characterHit(x,y),
  get rigStats() { return rigRenderer ? {vertices:rigRenderer.rig.vertices.length,triangles:rigRenderer.rig.triangles.length/3,ready:rigRenderer.ready} : null; },
  desktopAction: name => {stopIdleDance();if(name==='sit')return sitOnWindow();if(name==='stand'){leaveSeat();return true;}if(!DshMotion.LABELS[name]&&name!=='cuddle')return false;dshPlayer.play(name);return true;},
  sitOnWindow,leaveSeat,playIdleDance,
  get desktopIdle(){return idleDance.snapshot;},
  get desktopPack(){return {...dshPlayer.snapshot,seated};},
  get motion() { return {...motion.state, renderer:dshActive()?"dsh-webm":desktopRigActive() ? rigRenderer.displayMode : "png-fallback",error:rigError}; },
  get pet() { return { ...pet, wins: wins.length, perch: perch && perch.app }; },
  // 自述快照：就是上报给主进程的那份。调它可以直接验证「她知不知道自己在哪」。
  get self() {
    const ch = characterHeight(), cw = ch * characterAspect();
    return {
      x: Math.round(pet.x), y: Math.round(pet.y), w: Math.round(cw), h: Math.round(ch),
      sw: Math.round(W), sh: Math.round(H),
      state: pet.state, perch: perch ? perch.app : null,
      wins: wins.map(w => ({ app: w.app, x: w.x, y: w.y, w: w.w, h: w.h })),
      target: moveTarget ? Math.round(moveTarget.x) : null,
    };
  },
  moveTo,
};
</script>
